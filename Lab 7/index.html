<body>
    <script>
        function Dun(Operator){
            let num1 = document.getElementById("Score").value;
            let num2 = document.getElementById("Total").value;

            let answer = (num1 / num2) * 100;

            if (answer >= 74){
                document.getElementById("answer").textContent="You have passed!"
            } else{
                document.getElementById("answer").textContent="You have failed."
            }
        }

        function Ran(Operator){
            let num1 = document.getElementById("Score").value;
            let num2 = document.getElementById("Total").value;
            let answer = (num1 / num2) * 100;

            if (answer >= 74){
                document.getElementById("answer").textContent="You have passed!" + answer + "%";
            } else{
                document.getElementById("answer").textContent="You have failed." + answer + "%";
            }
        }


    </script>

    </select>
